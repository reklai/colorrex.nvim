# Everything except test/e2e, which needs a real Rex and a desktop. v0.12.0 is the
# floor colorrex asserts: a floor that is never run is a claim, not a test.
#
# The promises are only proven against real themes, and the conformance bounds are
# measured on a specific set of them, so the set is pinned rather than whatever is
# newest. It is the one Ghostty itself pins. Without these two the suite still
# passes, by skipping the tests that matter most.
name: test
on:
  push:
    branches: [main]
  pull_request:
env:
  THEMES_URL: https://deps.files.ghostty.org/ghostty-themes-release-20261019-151001-86a776d.tgz
  THEMES_SHA256: ab2513e316372c45c9f86e3e511aebdbfa6c39fa03c210096b19152fe288505b
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.12.0, stable, nightly]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: folke/lazy.nvim
          ref: stable
          path: .deps/lazy.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: |
          mkdir -p "$RUNNER_TEMP/themes"
          curl -fsSL "$THEMES_URL" -o "$RUNNER_TEMP/themes.tgz"
          echo "$THEMES_SHA256  $RUNNER_TEMP/themes.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/themes.tgz" -C "$RUNNER_TEMP/themes"
          themes=$(dirname "$(find "$RUNNER_TEMP/themes" -type f -name Dracula | head -n 1)")
          echo "COLORREX_THEMES=$themes" >> "$GITHUB_ENV"
          echo "COLORREX_LAZY=$PWD/.deps/lazy.nvim" >> "$GITHUB_ENV"
      - run: make test
